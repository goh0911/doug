<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Doug Storage Measurement</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1e1e2e; color: #ddd; padding: 24px; max-width: 700px; margin: 0 auto; }
  h1 { color: #ffd700; }
  pre { background: #000; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.6; }

  .err { color: #f87171; }
  button { background: #ffd700; color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; }

<body>
<h1>📊 Doug v2 ストレージ実測</h1>

<button id="rerun">もう一度実行</button>
<pre id="output">measuring...</pre>
<script src="measure-storage.js"></script>
<script>
document.getElementById('rerun').addEventListener('click', () => location.reload());
</script>
