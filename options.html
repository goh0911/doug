<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doug 設定</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; }
    .container { max-width: 480px; margin: 0 auto; padding: 24px 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Doug 設定</h1>

    <div class="section">
      <label for="apiProvider">APIプロバイダー:</label>
      <select id="apiProvider">
        <option value="gemini">Gemini</option>
        <option value="claude">Claude</option>
        <option value="openai">ChatGPT</option>
        <option value="ollama">Ollama (ローカル)</option>
      </select>
    </div>

    <div class="section api-key-section" id="geminiKeySection">
      <label for="geminiApiKey">Gemini APIキー:</label>
      <div class="field-with-toggle">
        <input type="password" id="geminiApiKey" placeholder="AIza...">
        <button class="btn-icon toggle-key-btn" data-target="geminiApiKey" title="表示/非表示">👁</button>
      </div>
      <div class="field-hint">
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">APIキーを取得</a>（無料枠あり）
      </div>
      <label for="geminiModel" style="margin-top:8px">モデル:</label>
      <select id="geminiModel">
        <option value="gemini-3.6-flash">gemini-3.6-flash（最新・推奨）</option>
        <option value="gemini-3.5-flash">gemini-3.5-flash</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite（高速）</option>
      </select>
    </div>

    <div class="section api-key-section" id="claudeKeySection" style="display:none">
      <label for="claudeApiKey">Claude APIキー:</label>
      <div class="field-with-toggle">
        <input type="password" id="claudeApiKey" placeholder="sk-ant-...">
        <button class="btn-icon toggle-key-btn" data-target="claudeApiKey" title="表示/非表示">👁</button>
      </div>
      <div class="field-hint">
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">APIキーを取得</a>
      </div>
      <label for="claudeModel" style="margin-top:8px">モデル:</label>
      <select id="claudeModel">
        <option value="claude-opus-4-8">claude-opus-4-8（最高品質）</option>
        <option value="claude-sonnet-5">claude-sonnet-5（推奨）</option>
        <option value="claude-haiku-4-5">claude-haiku-4-5（高速）</option>
      </select>
    </div>

    <div class="section api-key-section" id="openaiKeySection" style="display:none">
      <label for="openaiApiKey">OpenAI APIキー:</label>
      <div class="field-with-toggle">
        <input type="password" id="openaiApiKey" placeholder="sk-...">
        <button class="btn-icon toggle-key-btn" data-target="openaiApiKey" title="表示/非表示">👁</button>
      </div>
      <div class="field-hint">
        <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">APIキーを取得</a>
      </div>
      <label for="openaiModel" style="margin-top:8px">モデル:</label>
      <select id="openaiModel">
        <option value="gpt-5.6-sol">GPT-5.6 Sol（推奨）</option>
        <option value="gpt-5.6-terra">GPT-5.6 Terra</option>
        <option value="gpt-5.6-luna">GPT-5.6 Luna</option>
      </select>
    </div>

    <div class="section api-key-section" id="ollamaSection" style="display:none">
      <div id="ollamaStatus" class="ollama-status"></div>
      <label for="ollamaModel">モデル:</label>
      <select id="ollamaModel">
        <option value="qwen3.6:35b-a3b">qwen3.6:35b-a3b（24 GB・最高品質）</option>
        <option value="qwen3-vl:8b">qwen3-vl:8b（6.1 GB・推奨）</option>
        <option value="qwen3-vl:4b">qwen3-vl:4b（3.3 GB）</option>
        <option value="gemma4:12b">gemma4:12b（7.6 GB）</option>
      </select>
      <label for="ollamaEndpoint" style="margin-top:8px">エンドポイント:</label>
      <input type="text" id="ollamaEndpoint" placeholder="http://localhost:11434">
      <button id="ollamaInstallBtn" class="btn-secondary" style="display:none;margin-top:8px"></button>
      <div id="ollamaProgress" style="display:none;margin-top:8px">
        <div class="ollama-progress-bar">
          <div id="ollamaProgressFill" class="ollama-progress-fill"></div>
        </div>
        <div id="ollamaProgressText" class="field-hint" style="margin-top:4px"></div>
      </div>
      <div id="ollamaDownloadHint" class="field-hint" style="display:none;margin-top:8px">
        <a href="https://ollama.com/download" target="_blank" rel="noopener noreferrer">Ollama をダウンロード</a>してから起動してください
      </div>
    </div>

    <div class="section">
      <label class="toggle-row">
        <input type="checkbox" id="prefetch">
        <span>先読み翻訳（次2ページ）</span>
      </label>
    </div>

    <div class="section">
      <label class="toggle-row">
        <input type="checkbox" id="imagePreprocess">
        <span>画像前処理（コントラスト・明度を補正して翻訳精度を向上）</span>
      </label>
    </div>

    <div class="section">
      <label class="toggle-row">
        <input type="checkbox" id="glossEnabled">
        <span>固有名詞の解説ポップアップ（英語版Wikipediaを出典に表示）</span>
      </label>
      <div class="field-hint">有効にすると en.wikipedia.org へのアクセス許可を求めます。</div>
      <label for="glossEngine" style="margin-top:8px">生成エンジン:</label>
      <select id="glossEngine">
        <option value="auto">自動（Chrome内蔵AIを優先し、使えなければAPIを使う）</option>
        <option value="nano">Chrome内蔵AIのみ（APIキーを消費しない）</option>
        <option value="api">翻訳用APIのみ（品質優先）</option>
      </select>
    </div>

    <div class="section" id="whitelistSection" style="display:none">
      <label>カスタムサイト</label>
      <table class="whitelist-table">
        <thead>
          <tr>
            <th>サイト</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="whitelistItems"></tbody>
      </table>
    </div>

    <div class="section" id="apiStatsSection">
      <label>API使用回数</label>
      <table class="whitelist-table">
        <thead>
          <tr>
            <th>プロバイダー</th>
            <th style="text-align:right">回数</th>
          </tr>
        </thead>
        <tbody id="apiStatsItems"></tbody>
      </table>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span id="apiStatsResetDate" class="field-hint"></span>
        <button id="apiStatsResetBtn" class="btn-secondary" style="margin-left:auto">リセット</button>
      </div>
    </div>

    <div class="section">
      <label>シリーズ管理</label>
      <button id="openSeriesManagerBtn" class="btn-secondary">📚 シリーズ管理を開く</button>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn-primary">保存</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
